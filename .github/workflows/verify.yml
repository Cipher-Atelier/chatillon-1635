name: Evidence checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline verification
        run: python3 verification/check_all.py
      - name: Check changed-file whitespace
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Missing, zero or unavailable event bases use the merge-base with current origin/main.
        run: |
          if [ -z "$CHECK_BASE" ] || [ "$CHECK_BASE" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$CHECK_BASE^{commit}" 2>/dev/null; then
            CHECK_BASE=$(git merge-base origin/main HEAD)
          fi
          git diff --check "$CHECK_BASE" "$GITHUB_SHA"
